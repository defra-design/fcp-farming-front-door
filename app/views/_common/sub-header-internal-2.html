
{% set _subHeaderUser = myData.selectedUser or data.selectedUser %}

<div class="govuk-grid-row sub-header-container" >

  <div class="govuk-grid-column-full">
      <h3 class="govuk-heading-s govuk-!-margin-bottom-1" >{{_subHeaderUser.name}}</h3>
      {% if _subHeaderUser.crn %}
      <p class="govuk-body-s govuk-!-margin-bottom-2" >Customer reference number (CRN): {{_subHeaderUser.crn}}</p>
      {% endif %}
  </div>

</div>

<hr class="govuk-section-break govuk-section-break--visible govuk-!-margin-bottom-0 govuk-!-margin-top-2">
